services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - price_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "price_monitor.worker"]
    restart: unless-stopped
    volumes:
      - price_data:/data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3,time; c=sqlite3.connect(os.environ['PRICE_MONITOR_DB']); r=c.execute('SELECT heartbeat FROM worker_lease WHERE id=1').fetchone(); assert r and time.time()-r[0]<40"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  price_data:
