# Пустой шаблон. Скопируйте в secrets.toml только локально.
# Заполненный файл исключён из Git. Не вставляйте его содержимое в чат.
# После заполнения используется локальной проверкой и настройками Streamlit Secrets.

[cloud]
database_url = "" # Строка PostgreSQL из Neon -> Connect.

[auth]
# Точный адрес зададим при подготовке отдельного приложения.
redirect_uri = ""
cookie_secret = "" # Случайное значение; минимум 32 символа.
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
# Начальные роли для миграции; нужен хотя бы один admin_email.
# После миграции: открытая регистрация читателей, роли и блокировка в «Пользователи».
admin_emails = []
editor_emails = []
viewer_emails = []

[drive]
# Отдельное подключение владельца хранилища, не токен сотрудника, входящего в приложение.
client_id = ""
client_secret = ""
refresh_token = ""

# Цены конкурентов: перенесите существующий блок из Secrets приложения цен.
# Добавьте его к настройкам выше; не заменяйте Google, Neon и Drive.
[database]
host = ""
port = 6543 # Supabase transaction pooler; для обычного PostgreSQL используйте его порт.
dbname = "postgres"
user = ""
password = ""
sslmode = "require"

# Закрытые публичные паспорта конкурентов, в том же проекте Supabase.
# Secret key sb_secret_...: Settings → API Keys. Не публиковать этот ключ.
[passports]
url = ""
service_key = ""
bucket = "competitor-passports"
