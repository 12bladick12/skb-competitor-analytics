# Copy these fields into Advanced settings -> Secrets in Streamlit Cloud.
# Values from Supabase -> Connect -> Session pooler (port 5432).
# This is a database password, not a Supabase API key.
[database]
host = "YOUR-POOLER-HOST.pooler.supabase.com"
port = 5432
dbname = "postgres"
user = "postgres.YOUR-PROJECT-REF"
password = "YOUR-DATABASE-PASSWORD"
sslmode = "require"
