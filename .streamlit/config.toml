[theme]
base = "light"
primaryColor = "#7A1F2B"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#F3ECEE"
textColor = "#32262B"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
