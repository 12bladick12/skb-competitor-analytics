[theme]
primaryColor = "#DF6B27"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#EAF0F5"
textColor = "#172A3C"
font = "sans serif"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
