[theme]
primaryColor = "#7A1F2B"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#32262B"
font = '"Segoe UI", "Arial", sans-serif'
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
borderColor = "#E3E8EE"
showWidgetBorder = true
dataframeBorderColor = "#E3E8EE"
dataframeHeaderBackgroundColor = "#EEF1F4"

[theme.sidebar]
primaryColor = "#D89AAB"
backgroundColor = "#421923"
secondaryBackgroundColor = "#572633"
textColor = "#F5EDEF"
borderColor = "#61303B"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
